<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#12344d">Humanoid Locomotion - UML Architecture</text>
  <g font-family="Segoe UI,Arial" font-size="15">
    <rect x="40" y="80" width="240" height="180" rx="8" fill="#eef6fb" stroke="#12344d" stroke-width="2"/>
    <rect x="40" y="80" width="240" height="44" fill="#12344d"/>
    <text x="160" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">VelocityCommand</text>
    <text x="58" y="150" font-family="Consolas">+ vx_mps: double</text>
    <text x="58" y="180" font-family="Consolas">+ vy_mps: double</text>
    <text x="58" y="210" font-family="Consolas">+ wz_radps: double</text>
    <text x="58" y="238" font-family="Consolas">Body-relative request</text>

    <rect x="40" y="300" width="240" height="160" rx="8" fill="#fff7e6" stroke="#9a6700" stroke-width="2"/>
    <rect x="40" y="300" width="240" height="44" fill="#9a6700"/>
    <text x="160" y="328" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CommandLimiter</text>
    <text x="58" y="370" font-family="Consolas">std::clamp(vx)</text>
    <text x="58" y="400" font-family="Consolas">std::clamp(vy)</text>
    <text x="58" y="430" font-family="Consolas">std::clamp(wz)</text>

    <rect x="330" y="80" width="840" height="540" rx="10" fill="#f4f7fa" stroke="#475569" stroke-width="2"/>
    <text x="750" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">Humanoid Locomotion Control Cycle</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="370" y="150" width="230" height="55" rx="6"/><text x="485" y="183" text-anchor="middle">1. Limit velocity</text>
      <rect x="650" y="150" width="230" height="55" rx="6"/><text x="765" y="183" text-anchor="middle">2. Estimate state</text>
      <rect x="900" y="150" width="230" height="55" rx="6"/><text x="1015" y="183" text-anchor="middle">3. Plan footsteps</text>
      <rect x="370" y="260" width="230" height="55" rx="6"/><text x="485" y="293" text-anchor="middle">4. Swing trajectory</text>
      <rect x="650" y="260" width="230" height="55" rx="6"/><text x="765" y="293" text-anchor="middle">5. Inverse kinematics</text>
      <rect x="900" y="260" width="230" height="55" rx="6"/><text x="1015" y="293" text-anchor="middle">6. Stabilize whole body</text>
      <rect x="370" y="370" width="230" height="55" rx="6"/><text x="485" y="403" text-anchor="middle">7. Joint commands</text>
      <rect x="650" y="370" width="230" height="55" rx="6"/><text x="765" y="403" text-anchor="middle">8. Safety limits</text>
      <rect x="900" y="370" width="230" height="55" rx="6"/><text x="1015" y="403" text-anchor="middle">9. Robot interface</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="600" y1="178" x2="650" y2="178"/><line x1="880" y1="178" x2="900" y2="178"/>
      <line x1="1015" y1="205" x2="1015" y2="260"/><line x1="900" y1="288" x2="880" y2="288"/>
      <line x1="650" y1="288" x2="600" y2="288"/><line x1="485" y1="315" x2="485" y2="370"/>
      <line x1="600" y1="398" x2="650" y2="398"/><line x1="880" y1="398" x2="900" y2="398"/>
      <line x1="1015" y1="425" x2="1015" y2="520"/><line x1="1015" y1="520" x2="765" y2="520"/>
      <line x1="765" y1="520" x2="765" y2="205"/>
    </g>
    <rect x="370" y="540" width="760" height="55" rx="6" fill="#eaf8f8" stroke="#087e8b" stroke-width="2"/>
    <text x="750" y="574" text-anchor="middle" font-family="Consolas" font-size="14">Sensors -&gt; state estimate -&gt; perceives, plans, controls, measures and corrects</text>

    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  </g>
</svg>
