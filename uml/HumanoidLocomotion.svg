<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#12344d">Humanoid Locomotion - UML Architecture (Section 1.4)</text>
  <g font-family="Segoe UI,Arial" font-size="15">
    <rect x="35" y="75" width="300" height="170" rx="8" fill="#eef6fb" stroke="#12344d" stroke-width="2"/>
    <rect x="35" y="75" width="300" height="44" fill="#12344d"/>
    <text x="185" y="104" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">VelocityCommand</text>
    <text x="55" y="145" font-family="Consolas">+ vx_mps: double</text>
    <text x="55" y="175" font-family="Consolas">+ vy_mps: double</text>
    <text x="55" y="205" font-family="Consolas">+ wz_radps: double</text>
    <text x="55" y="232" fill="#475569">Forward, lateral, turning</text>

    <rect x="35" y="270" width="300" height="150" rx="8" fill="#fff7e6" stroke="#9a6700" stroke-width="2"/>
    <rect x="35" y="270" width="300" height="44" fill="#9a6700"/>
    <text x="185" y="299" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CommandLimiter</text>
    <text x="55" y="342" font-family="Consolas">std::clamp(vx, vy, wz)</text>
    <text x="55" y="372" font-family="Consolas">acceleration/jerk outside model</text>
    <text x="55" y="400" fill="#475569">Demonstration only</text>

    <rect x="35" y="445" width="300" height="290" rx="8" fill="#edf8ed" stroke="#276738" stroke-width="2"/>
    <rect x="35" y="445" width="300" height="44" fill="#276738"/>
    <text x="185" y="474" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Section 1.4 Balance Models</text>
    <text x="55" y="518" font-weight="700">Standing</text>
    <text x="55" y="542" font-family="Consolas">Neutral stand + IMU PD</text>
    <text x="55" y="566" font-family="Consolas">CoP pressure-weighted point</text>
    <text x="55" y="590" font-family="Consolas">Weight transfer gate</text>
    <text x="55" y="614" font-weight="700">Stability models</text>
    <text x="55" y="638" font-family="Consolas">ZMP / CoP support polygon</text>
    <text x="55" y="662" font-family="Consolas">LIPM p = x - z/g*x''</text>
    <text x="55" y="686" fill="#475569">Illustrative planning only</text>
    <text x="55" y="710" fill="#475569">Hardware limits require review</text>

    <rect x="380" y="75" width="985" height="650" rx="10" fill="#f4f7fa" stroke="#475569" stroke-width="2"/>
    <text x="872" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">Humanoid Locomotion Control Cycle</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="410" y="145" width="210" height="55" rx="6"/><text x="515" y="178" text-anchor="middle">1. Limit velocity</text>
      <rect x="650" y="145" width="210" height="55" rx="6"/><text x="755" y="178" text-anchor="middle">2. Verify safety/state</text>
      <rect x="890" y="145" width="210" height="55" rx="6"/><text x="995" y="178" text-anchor="middle">3. Maintain standing</text>
      <rect x="1130" y="145" width="210" height="55" rx="6"/><text x="1235" y="178" text-anchor="middle">4. Correct IMU posture</text>

      <rect x="410" y="255" width="210" height="55" rx="6"/><text x="515" y="288" text-anchor="middle">5. Calculate CoP</text>
      <rect x="650" y="255" width="210" height="55" rx="6"/><text x="755" y="288" text-anchor="middle">6. Transfer weight</text>
      <rect x="890" y="255" width="210" height="55" rx="6"/><text x="995" y="288" text-anchor="middle">7. Evaluate ZMP/LIPM</text>
      <rect x="1130" y="255" width="210" height="55" rx="6"/><text x="1235" y="288" text-anchor="middle">8. Estimate state</text>

      <rect x="410" y="365" width="210" height="55" rx="6"/><text x="515" y="398" text-anchor="middle">9. Plan footsteps</text>
      <rect x="650" y="365" width="210" height="55" rx="6"/><text x="755" y="398" text-anchor="middle">10. Swing trajectory</text>
      <rect x="890" y="365" width="210" height="55" rx="6"/><text x="995" y="398" text-anchor="middle">11. Inverse kinematics</text>
      <rect x="1130" y="365" width="210" height="55" rx="6"/><text x="1235" y="398" text-anchor="middle">12. Stabilize whole body</text>

      <rect x="410" y="475" width="210" height="55" rx="6"/><text x="515" y="508" text-anchor="middle">13. Joint commands</text>
      <rect x="650" y="475" width="210" height="55" rx="6"/><text x="755" y="508" text-anchor="middle">14. Safety limits</text>
      <rect x="890" y="475" width="210" height="55" rx="6"/><text x="995" y="508" text-anchor="middle">15. Robot interface</text>
      <rect x="1130" y="475" width="210" height="55" rx="6"/><text x="1235" y="508" text-anchor="middle">16. Sensors/feedback</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="620" y1="172" x2="650" y2="172"/>
      <line x1="860" y1="172" x2="890" y2="172"/>
      <line x1="1100" y1="172" x2="1130" y2="172"/>
      <line x1="1235" y1="200" x2="1235" y2="255"/>
      <line x1="1130" y1="282" x2="1100" y2="282"/>
      <line x1="890" y1="282" x2="860" y2="282"/>
      <line x1="650" y1="282" x2="620" y2="282"/>
      <line x1="515" y1="310" x2="515" y2="365"/>
      <line x1="620" y1="392" x2="650" y2="392"/>
      <line x1="860" y1="392" x2="890" y2="392"/>
      <line x1="1100" y1="392" x2="1130" y2="392"/>
      <line x1="1235" y1="420" x2="1235" y2="475"/>
      <line x1="1130" y1="502" x2="1100" y2="502"/>
      <line x1="890" y1="502" x2="860" y2="502"/>
      <line x1="650" y1="502" x2="620" y2="502"/>
      <line x1="1235" y1="530" x2="1235" y2="675"/>
      <line x1="1235" y1="675" x2="755" y2="675"/>
      <line x1="755" y1="675" x2="755" y2="200"/>
    </g>
    <rect x="410" y="635" width="930" height="55" rx="6" fill="#eaf8f8" stroke="#087e8b" stroke-width="2"/>
    <text x="875" y="668" text-anchor="middle" font-family="Consolas" font-size="14">Perceive -> Estimate -> Plan -> Control -> Measure -> Correct</text>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  </g>
</svg>
